site_name: chap-test-data
site_description: Generate Chap test datasets of any size and upload, check and compare them against Chap
site_url: https://dhis2-chap.github.io/chap-test-data/
repo_url: https://github.com/dhis2-chap/chap-test-data
repo_name: dhis2-chap/chap-test-data
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - content.code.copy

plugins:
  - search
  - llmstxt:
      markdown_description: >
        chap-test-data makes up datasets for Chap, the DHIS2 climate and health modelling platform,
        in any size (10 to 100,000 locations, weekly or monthly, over any number of years), and
        sends them to Chap to check its answers. Install with `uv sync`, then use the
        `chap-test-data` command: `generate NAME` writes one dataset folder (Parquet observations,
        GeoParquet locations, GeoJSON location hierarchy, an expected.json with the answer Chap
        should give); `upload FOLDER` and `check` send datasets to a running Chap, straight or
        through a DHIS2 route; `compare` measures Parquet against the JSON the Modeling App sends
        today. `scripts/generate-ready-made.sh` writes a fixed set of datasets, the same every time.
        Every command explains its options with `--help`.
      full_output: llms-full.txt
      sections:
        Start here:
          - index.md: "What a dataset is, and the words used"
          - getting-started.md: "Install, start Chap and DHIS2, connection settings"
        Datasets:
          - ready-made.md: "The fixed set of test datasets and the answer Chap should give for each"
          - generating.md: "Every option of `chap-test-data generate`, the formats, the values and the location hierarchy"
        Using them with Chap:
          - uploading.md: "`upload`, `check`, and the same with curl"
          - comparing.md: "`compare`, and uploads over a slow link"
          - checks.md: "`time-checks`"
        Optional:
          - about.md: "Why the tool exists, related projects, license"

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Datasets:
      - Ready-made datasets: ready-made.md
      - Generating your own: generating.md
  - Uploading and checking: uploading.md
  - Comparing with JSON: comparing.md
  - Timing the checks: checks.md
  - About: about.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
