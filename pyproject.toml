[project]
name = "chap-test-data"
version = "0.1.0"
description = "Generate Chap test datasets (Parquet, CSV, GeoJSON, make-dataset JSON) and upload, check and compare them against Chap"
readme = "README.md"
license = { text = "AGPLv3 license" }
authors = [
    { name = "Morten Hansen", email = "morten@dhis2.org" }
]
requires-python = ">=3.13"
dependencies = [
    "duckdb>=2.0.1",
    "geopandas>=1.2.0",
    "httpx2>=2.16.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.4",
    "shapely>=2.2.0",
    "typer>=0.29.3",
]

[project.scripts]
chap-test-data = "chap_test_data:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage>=7.17.5",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.8.2",
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "types-geopandas>=1.2.0.20261122",
    "types-shapely>=2.2.0.20261122",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint.per-file-ignores]
# As in chap-core: tests are formatted, not linted.
"tests/**/*.py" = ["ALL"]

[tool.ruff.lint]
select = ["I", "UP", "F", "B", "C4", "PIE", "RUF", "FURB", "PERF", "ISC", "RSE", "W", "A", "TCH", "SIM", "S"]
# Same rules as chap-core. S101: assert guards invariants. S311: random is for synthetic data.
ignore = ["B008", "RUF012", "SIM108", "SIM115", "S101", "S311", "S603", "S607"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
files = ["src/"]

[[tool.mypy.overrides]]
module = ["pyarrow.*"]
ignore_missing_imports = true

[tool.pyright]
pythonVersion = "3.13"
include = ["src/"]
typeCheckingMode = "basic"
useLibraryCodeForTypes = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["chap_test_data"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = true
